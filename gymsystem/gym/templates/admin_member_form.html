{% extends 'base.html' %}

{% block title %}
<title>
    {% if mode == 'add' %}
        Add Member
    {% else %}
        Edit Member
    {% endif %}
</title>
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">
                        <i class="fa-solid fa-users"></i>

                        {% if mode == 'add' %}
                            Add New Member
                        {% else %}
                            Edit Member
                        {% endif %}
                    </h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row g-4">

                            {% if mode == 'add' %}

                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Username <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter Username"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Password <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter Password"
                                    required>
                            </div>

                            {% endif %}

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Full Name <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    name="full_name"
                                    class="form-control"
                                    value="{{ member.full_name|default:'' }}"
                                    placeholder="Enter Full Name"
                                    required>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label fw-bold">
                                    Mobile
                                </label>

                                <input
                                    type="text"
                                    name="mobile"
                                    class="form-control"
                                    value="{{ member.mobile|default:'' }}"
                                    placeholder="9876543210">

                            </div>

                            <div class="col-md-3">

                                <label class="form-label fw-bold">
                                    Age
                                </label>

                                <input
                                    type="number"
                                    name="age"
                                    class="form-control"
                                    value="{{ member.age|default:'' }}">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label fw-bold">
                                    Gender
                                </label>

                                <select
                                    name="gender"
                                    class="form-select">

                                    <option value="">Select Gender</option>

                                    <option value="Male"
                                        {% if member.gender == 'Male' %}selected{% endif %}>
                                        Male
                                    </option>

                                    <option value="Female"
                                        {% if member.gender == 'Female' %}selected{% endif %}>
                                        Female
                                    </option>

                                    <option value="Other"
                                        {% if member.gender == 'Other' %}selected{% endif %}>
                                        Other
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label fw-bold">
                                    Joining Date
                                </label>

                                <input
                                    type="date"
                                    name="joining_date"
                                    class="form-control"
                                    value="{{ member.joining_date|date:'Y-m-d'|default:'' }}">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label fw-bold">
                                    Address
                                </label>

                                <textarea
                                    name="address"
                                    class="form-control"
                                    rows="1">{{ member.address|default:'' }}</textarea>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Membership Plan
                                </label>

                                <select
                                    name="plan"
                                    class="form-select">

                                    <option value="">
                                        Select Plan
                                    </option>

                                    {% for plan in plans %}

                                    <option
                                        value="{{ plan.id }}"
                                        {% if member.plan and member.plan.id == plan.id %}selected{% endif %}>

                                        {{ plan.name }} - {{ plan.duration }} Month(s) (${{ plan.price }})

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Trainer
                                </label>

                                <select
                                    name="trainer"
                                    class="form-select">

                                    <option value="">
                                        Select Trainer
                                    </option>

                                    {% for trainer in trainers %}

                                    <option
                                        value="{{ trainer.id }}"
                                        {% if member.trainer and member.trainer.id == trainer.id %}selected{% endif %}>

                                        {{ trainer.name }} - {{ trainer.speciallization }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'admin_member_list' %}"
                               class="btn btn-secondary">

                                <i class="fa-solid fa-arrow-left"></i>

                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>

                                {% if mode == 'add' %}
                                    Save Member
                                {% else %}
                                    Update Member
                                {% endif %}

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
