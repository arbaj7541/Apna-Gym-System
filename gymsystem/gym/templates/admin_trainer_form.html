{% extends 'base.html' %}

{% block title %}
<title>
    {% if mode == 'add' %}Add Trainer{% else %}Edit Trainer{% endif %}
</title>
{% endblock %}

{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">
                        <i class="fa-solid fa-user-tie"></i>
                        {% if mode == 'add' %}
                            Add Trainer
                        {% else %}
                            Edit Trainer
                        {% endif %}
                    </h3>
                </div>

                <div class="card-body">

                    <!-- IMPORTANT -->
                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="row g-4">

                            <!-- Name -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Trainer Name
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter Trainer Name"
                                    value="{{ trainer.name|default:'' }}"
                                    required>
                            </div>

                            <!-- Mobile -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Mobile Number
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    name="mobile"
                                    class="form-control"
                                    placeholder="9876543210"
                                    value="{{ trainer.mobile|default:'' }}"
                                    required>
                            </div>

                            <!-- Specialization -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Specialization
                                </label>

                                <input
                                    type="text"
                                    name="specialization"
                                    class="form-control"
                                    placeholder="Example: Cardio, Yoga, Strength Training"
                                    value="{{ trainer.specialization|default:'' }}">
                            </div>

                            <!-- Shift Timing -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Shift Timing
                                </label>

                                <input
                                    type="time"
                                    name="shift_timings"
                                    class="form-control"
                                    value="{{ trainer.shift_timings|time:'H:i' }}">
                            </div>

                            <!-- Photo -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Photo
                                </label>

                                <input
                                    type="file"
                                    name="photo"
                                    class="form-control">

                                {% if trainer.photo %}
                                    <img src="{{ trainer.photo.url }}"
                                         width="120"
                                         class="mt-2 rounded border">
                                {% endif %}
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="example@gmail.com"
                                    value="{{ trainer.email|default:'' }}">
                            </div>

                            <!-- Experience -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Experience (Years)
                                </label>

                                <input
                                    type="number"
                                    name="experience"
                                    class="form-control"
                                    placeholder="Experience"
                                    value="{{ trainer.experience|default:'' }}">
                            </div>

                            <!-- Salary -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Salary
                                </label>

                                <input
                                    type="number"
                                    step="0.01"
                                    name="salary"
                                    class="form-control"
                                    placeholder="Salary"
                                    value="{{ trainer.salary|default:'' }}">
                            </div>

                            <!-- Joining Date -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Joining Date
                                </label>

                                <input
                                    type="date"
                                    name="joining_date"
                                    class="form-control"
                                    value="{{ trainer.joining_date|date:'Y-m-d' }}">
                            </div>

                            <!-- Active -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Active Status
                                </label>

                                <div class="form-check mt-2">

                                    <input
                                        type="checkbox"
                                        class="form-check-input"
                                        id="is_active"
                                        name="is_active"
                                        {% if trainer.is_active %}checked{% endif %}>

                                    <label
                                        class="form-check-label"
                                        for="is_active">
                                        Active
                                    </label>

                                </div>
                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'admin_trainer_list' %}"
                               class="btn btn-secondary">
                                <i class="fa-solid fa-arrow-left"></i>
                                Back
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>

                                {% if mode == 'add' %}
                                    Save Trainer
                                {% else %}
                                    Update Trainer
                                {% endif %}

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
