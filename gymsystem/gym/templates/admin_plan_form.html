{% extends 'base.html' %}

{% block title %}
<title>
    {% if mode == 'add' %}
        Add Membership Plan
    {% else %}
        Edit Membership Plan
    {% endif %}
</title>
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        <i class="fa-solid fa-id-card"></i>

                        {% if mode == 'add' %}
                            Add Membership Plan
                        {% else %}
                            Edit Membership Plan
                        {% endif %}

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row g-4">

                            <!-- Plan Name -->

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Plan Name
                                    <span class="text-danger">*</span>

                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter Plan Name"
                                    value="{{ plan.name|default:'' }}"
                                    required>

                            </div>

                            <!-- Duration -->

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Duration (Months)
                                    <span class="text-danger">*</span>

                                </label>

                                <input
                                    type="number"
                                    name="duration_months"
                                    class="form-control"
                                    min="1"
                                    placeholder="Example: 3"
                                    value="{{ plan.duration_months|default:'' }}"
                                    required>

                            </div>

                            <!-- Price -->

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Price
                                    <span class="text-danger">*</span>

                                </label>

                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    placeholder="Enter Price"
                                    value="{{ plan.price|default:'' }}"
                                    required>

                            </div>

                            <!-- Description -->

                            <div class="col-md-6">

                                <label class="form-label fw-bold">

                                    Description

                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter Plan Description">{{ plan.description|default:'' }}</textarea>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'admin_plans_list' %}"
                               class="btn btn-secondary">

                                <i class="fa-solid fa-arrow-left"></i>

                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>

                                {% if mode == 'add' %}
                                    Save Plan
                                {% else %}
                                    Update Plan
                                {% endif %}

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
