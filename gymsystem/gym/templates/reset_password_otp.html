{% extends 'base.html' %}
{% block title %}<title>Reset Password OTP | FitPro GYM</title>{% endblock %}

{% block extra_css %}
<style>
    body { background: linear-gradient(135deg, #0f0f1a 0%, #1a0a3a 50%, #0a1a2e 100%); min-height: 100vh; display: flex; align-items: center; }
    .auth-wrapper { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card {
        width: 100%; max-width: 440px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(30px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 24px; padding: 2.5rem; text-align: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div style="font-size:3rem; margin-bottom:1rem;">🔑</div>
        <h2 style="font-weight:800;">Set New Password</h2>
        <p style="color:var(--text-muted); font-size:0.875rem;">Enter the 6-digit OTP code sent to {{ user.email }} and choose your new password.</p>

        <form method="post" action="{% url 'reset_password_otp' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-start d-block">6-Digit OTP</label>
                <input type="text" name="otp" class="form-control text-center fw-bold" maxlength="6" placeholder="000000" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label text-start d-block">New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg" style="border-radius:12px; font-weight:700;">
                Reset Password & Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}
