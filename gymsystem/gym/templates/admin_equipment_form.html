{% extends 'base.html' %}

{% block title %}
<title>
    {% if mode == 'add' %}
        Add Equipment
    {% else %}
        Edit Equipment
    {% endif %}
</title>
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        <i class="fa-solid fa-dumbbell"></i>

                        {% if mode == 'add' %}
                            Add Equipment
                        {% else %}
                            Edit Equipment
                        {% endif %}

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row g-4">

                            <!-- Equipment Name -->
                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Equipment Name
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter Equipment Name"
                                    value="{{ equipment.name|default:'' }}"
                                    required>

                            </div>

                            <!-- Units -->
                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Units
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="number"
                                    name="units"
                                    class="form-control"
                                    min="1"
                                    placeholder="Enter Units"
                                    value="{{ equipment.units|default:'' }}"
                                    required>

                            </div>

                            <!-- Price -->
                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Price
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    placeholder="Enter Price"
                                    value="{{ equipment.price|default:'' }}"
                                    required>

                            </div>

                            <!-- Purchase Date -->
                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Purchase Date
                                </label>

                                <input
                                    type="date"
                                    name="purchase_date"
                                    class="form-control"
                                    value="{{ equipment.purchase_date|date:'Y-m-d'|default:'' }}">

                            </div>

                            <!-- Active -->
                            <div class="col-12">

                                <div class="form-check form-switch">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="is_active"
                                        id="is_active"
                                        {% if equipment.is_active %}checked{% endif %}>

                                    <label
                                        class="form-check-label fw-bold"
                                        for="is_active">

                                        Equipment Available

                                    </label>

                                </div>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'admin_equipment_list' %}"
                               class="btn btn-secondary">

                                <i class="fa-solid fa-arrow-left"></i>

                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>

                                {% if mode == 'add' %}
                                    Save Equipment
                                {% else %}
                                    Update Equipment
                                {% endif %}

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
